<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-1">
                <!--search-->
                <div class="search-input">
                    <label for="search-bar">
                        <img src="./assets/magnify.svg" height="25" width="25">
                    </label>
                    <input type="search" id="search-bar">
                </div>
                <!--notifications-->
                <div class="notifications">
                    <img src="./assets/bell-outline.svg" height="20" width="20">
                </div>
                <!--small icon-->
                <div class="small-icon">
                    <img src="./assets/profile.jpg" height="55" width="55">
                </div>
                <!--name-->
                <div class="name">
                    <div>Morgan Oakley</div>
                </div>
            </div>
            <div class="header-2">
                <!--large icon-->
                <div class="large-icon">
                    <img src="./assets/profile.jpg" height="100" width="100">
                </div>
                <!--welcome user-->
                <div class="welcome-user">
                    <div><div style="font-size: 2rem;">Hi there,</div>Morgan Oakley (@morgan)</div>
                </div>
                <!--actions-->
                <div class="actions">
                    <button>New</button>
                    <button>Upload</button>
                    <button>Share</button>
                </div>
            </div>

        </div>

        <div class="sidebar">
            <a href="#" class="sidebar-title">
                <img src="./assets/view-dashboard.svg" alt="">
                <span>Dashboard</span>
            </a>

            <nav class="sidebar-nav">
                <a href="#" class="sidebar-item">
                    <img src="./assets/home-circle.svg" alt="">
                    <span>Home</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/face-man-profile.svg" alt="">
                    <span>Profile</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/message-outline.svg" alt="">
                    <span>Messages</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/history.svg" alt="">
                    <span>History</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/calendar-check-outline.svg" alt="">
                    <span>Tasks</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/account-group.svg" alt="">
                    <span>Communities</span>
                </a>
            </nav>
            
            <nav class="sidebar-more-options">
                <a href="#" class="sidebar-item">
                    <img src="./assets/cog.svg" alt="">
                    <span>Settings</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/help-circle.svg" alt="">
                    <span>Support</span>
                </a>
        
                <a href="#" class="sidebar-item">
                    <img src="./assets/shield-alert-outline.svg" alt="">
                    <span>Privacy</span>
                </a>
            </nav>

        </div>

        <div class="content">
            <div class="projects">
                <div class="section-header">Your Projects</div>

            </div>
            <div class="announcements">
                <div class="section-header">Announcements</div>

            </div>
            <div class="trending">
                <div class="section-header">Trending</div>

            </div>
        </div>

    </div>
</body>
</html>
